<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tugas Besar Sistem Kendali</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#f8fafc;color:#1e293b;height:100vh;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.header h1{font-size:1.2rem;font-weight:700;color:#0f172a}
.header .conn{font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:6px}
.header .conn .dot{width:8px;height:8px;border-radius:50%}
.main-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;height:calc(100vh - 70px)}
.left-col{display:flex;flex-direction:column;gap:12px}
.right-col{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e2e8f0;flex:1}
.grow{flex:2}
.card h2{font-size:.85rem;font-weight:700;color:#475569;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.sensor-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sensor-cell{padding:8px 6px;text-align:center;border-radius:8px;background:#f1f5f9;transition:all .3s}
.sensor-cell .lbl{font-size:.65rem;font-weight:600;color:#94a3b8;text-transform:uppercase}
.sensor-cell .val{font-size:1.5rem;font-weight:800;margin-top:2px}
.sensor-cell.safe{color:#16a34a}
.sensor-cell.warn{color:#d97706;background:#fef3c7}
.sensor-cell.danger{color:#dc2626;background:#fee2e2}
.mode-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.btn{font-size:.8rem;font-weight:600;padding:8px 18px;border:none;border-radius:6px;cursor:pointer;transition:all .15s}
.btn-auto{background:#3b82f6;color:#fff}.btn-auto.on{background:#1d4ed8}
.btn-stop2{background:#ef4444;color:#fff}
.mode-lbl{font-size:.8rem;color:#64748b;font-weight:600}
.dpad{display:inline-grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:4px}
.dpad button{width:56px;height:56px;border:none;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dpad button:active{transform:scale(.95)}
.btn-up{background:#3b82f6;color:#fff;grid-column:2;grid-row:1}
.btn-left{background:#e2e8f0;color:#334155;grid-column:1;grid-row:2}
.btn-center{background:#ef4444;color:#fff;grid-column:2;grid-row:2;font-size:.75rem}
.btn-right{background:#e2e8f0;color:#334155;grid-column:3;grid-row:2}
.btn-down{background:#94a3b8;color:#fff;grid-column:2;grid-row:3}
.slider-row{margin:10px 0;text-align:center}
.slider-row label{font-size:.75rem;color:#64748b}
.slider-row input{width:80%;max-width:220px;accent-color:#3b82f6}
.hint{font-size:.65rem;color:#94a3b8;text-align:center;margin-top:2px}
canvas{width:100%;height:180px;border-radius:6px;border:1px solid #e2e8f0;background:#f8fafc}
.pid-inputs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.pid-inputs label{font-size:.7rem;color:#64748b;font-weight:600}
.pid-inputs input{width:60px;padding:5px 6px;border:1px solid #cbd5e1;border-radius:5px;font-size:.8rem;text-align:center;background:#fff}
.pid-inputs button{font-size:.75rem;font-weight:600;padding:5px 16px;border:none;border-radius:5px;background:#3b82f6;color:#fff;cursor:pointer}
.pid-info{display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:.75rem;color:#64748b}
.pid-info b{color:#0f172a}
.sts{text-align:center;font-size:.7rem;color:#3b82f6;margin-top:4px;font-weight:600}
@media(max-width:700px){.main-grid{grid-template-columns:1fr;overflow-y:auto}.card{flex:none}}
</style>
</head>
<body>

<div class="header">
  <h1>Tugas Besar Sistem Kendali</h1>
  <div class="conn"><span class="dot" id="connDot" style="background:#22c55e"></span><span id="connTxt" style="color:#16a34a">ONLINE</span></div>
</div>

<div class="main-grid">
  <div class="left-col">
    <div class="card"><h2>Sensors</h2>
      <div class="sensor-grid">
        <div class="sensor-cell safe" id="sfCell"><span class="lbl">FRONT</span><span class="val" id="sf">--</span></div>
        <div class="sensor-cell safe" id="slCell"><span class="lbl">LEFT</span><span class="val" id="sl">--</span></div>
        <div class="sensor-cell safe" id="srCell"><span class="lbl">RIGHT</span><span class="val" id="sr">--</span></div>
        <div class="sensor-cell safe" id="sbCell"><span class="lbl">BACK</span><span class="val" id="sb">--</span></div>
      </div>
    </div>

    <div class="card grow"><h2>PID Graph</h2><canvas id="graph"></canvas></div>

    <div class="card"><h2>PID Tuning</h2>
      <div class="pid-inputs">
        <label>Set</label><input id="spsp" type="number" step="1" value="40" min="5" max="200" style="width:60px"><label style="font-size:0.7rem;color:#94a3b8">cm</label>
        <label>Kp</label><input id="spkp" type="number" step="0.1" value="1.0">
        <label>Ki</label><input id="spki" type="number" step="0.01" value="0.1">
        <label>Kd</label><input id="spkd" type="number" step="0.01" value="0.05">
        <button id="spBtn">SET</button>
      </div>
      <div class="pid-info">
        <span>Error: <b id="spe">0.0</b></span>
        <span>Output: <b id="spo">0</b>%</span>
        <span>Speed: <b id="svAll">0</b></span>
      </div>
    </div>
  </div>

  <div class="right-col">
    <div class="card"><h2>Control</h2>
      <div class="mode-row">
        <button class="btn btn-auto" id="cruiseBtn">D</button>
        <button class="btn btn-auto" id="wallBtn">R</button>
        <button class="btn btn-stop2" id="stopBtn">STOP</button>
        <span class="mode-lbl" id="modeLabel">Manual</span>
      </div>
      <div style="text-align:center">
        <div class="dpad">
          <button class="btn-up" data-c="forward">W</button>
          <button class="btn-left" data-c="left">A</button>
          <button class="btn-center" data-c="stop">S</button>
          <button class="btn-right" data-c="right">D</button>
          <button class="btn-down" data-c="backward">X</button>
        </div>
      </div>
      <div class="slider-row">
        <label>Speed: <span id="spdL">70</span>%</label>
        <input type="range" id="spd" min="0" max="100" value="70" oninput="document.getElementById('spdL').textContent=this.value">
      </div>
      <div class="hint">W A S D + X &bull; Space = AUTO</div>
      <div class="sts" id="st">Ready</div>
    </div>
  </div>
</div>

<script>
var ws = null;
var reconnectTimer = null;

function setOnline(online) {
  if (online) {
    document.getElementById('connDot').style.background = '#22c55e';
    document.getElementById('connTxt').textContent = 'ONLINE';
    document.getElementById('connTxt').style.color = '#16a34a';
  } else {
    document.getElementById('connDot').style.background = '#ef4444';
    document.getElementById('connTxt').textContent = 'OFFLINE';
    document.getElementById('connTxt').style.color = '#dc2626';
  }
}

function wsConnect() {
  if (ws) { ws.close(); ws = null; }

  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var url = proto + '//' + location.host + '/ws';
  ws = new WebSocket(url);

  ws.onopen = function() {
    setOnline(true);
    document.getElementById('st').textContent = 'WS connected';
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  };

  ws.onmessage = function(evt) {
    try {
      var d = JSON.parse(evt.data);
      updateUI(d);
    } catch(e) {}
  };

  ws.onclose = function() {
    setOnline(false);
    document.getElementById('st').textContent = 'WS disconnected';
    if (!reconnectTimer) reconnectTimer = setTimeout(wsConnect, 2000);
  };

  ws.onerror = function() {
    ws.close();
  };
}

function updateUI(d) {
  document.getElementById('sf').innerHTML = d.sensors.front.toFixed(1) + ' cm';
  document.getElementById('sl').innerHTML = d.sensors.left.toFixed(1) + ' cm';
  document.getElementById('sr').innerHTML = d.sensors.right.toFixed(1) + ' cm';
  document.getElementById('sb').innerHTML = d.sensors.back.toFixed(1) + ' cm';
  setCellColor('sf', d.sensors.front, 40);
  setCellColor('sl', d.sensors.left, 40);
  setCellColor('sr', d.sensors.right, 40);
  setCellColor('sb', d.sensors.back, 15);
  drawGraph(d.graph);
  if (d.auto_mode) {
    if (d.drive_mode === 0) {
      document.getElementById('cruiseBtn').classList.add('on');
      document.getElementById('wallBtn').classList.remove('on');
      document.getElementById('modeLabel').textContent = 'Cruise';
    } else {
      document.getElementById('cruiseBtn').classList.remove('on');
      document.getElementById('wallBtn').classList.add('on');
      document.getElementById('modeLabel').textContent = 'Maintain';
    }
  } else {
    document.getElementById('cruiseBtn').classList.remove('on');
    document.getElementById('wallBtn').classList.remove('on');
    document.getElementById('modeLabel').textContent = 'Manual';
  }
  document.getElementById('svAll').textContent = d.pid.output;
  document.getElementById('spe').textContent = d.pid.error.toFixed(1);
  document.getElementById('spo').textContent = d.pid.output.toFixed(0);
}

function sc(c) {
  var s = document.getElementById('spd').value;
  fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cmd:c,speed:parseInt(s)})})
  .then(function(r){return r.json()}).then(function(d){document.getElementById('st').textContent=d.status}).catch(function(){});
  document.getElementById('st').textContent = c.toUpperCase();
}

document.querySelectorAll('.dpad button[data-c]').forEach(function(b){
  var c = b.getAttribute('data-c');
  b.addEventListener('mousedown', function(e){e.preventDefault();sc(c);});
  b.addEventListener('mouseup', function(){sc('stop');});
  b.addEventListener('mouseleave', function(){sc('stop');});
  b.addEventListener('touchstart', function(e){e.preventDefault();sc(c);});
  b.addEventListener('touchend', function(e){e.preventDefault();sc('stop');});
  b.addEventListener('touchcancel', function(e){e.preventDefault();sc('stop');});
});

document.addEventListener('keydown', function(e){
  if(e.repeat)return;
  if(e.key===' '){e.preventDefault();document.getElementById('cruiseBtn').click();return}
  var m={w:'forward',a:'left',s:'stop',d:'right',x:'backward'};
  var c=m[e.key.toLowerCase()];
  if(c){e.preventDefault();sc(c)}
});
document.addEventListener('keyup', function(e){
  var m={w:'forward',a:'left',s:'stop',d:'right',x:'backward'};
  var c=m[e.key.toLowerCase()];
  if(c){e.preventDefault();sc('stop')}
});

function setDriveMode(mode) {
  fetch('/api/mode', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mode:mode})});
  var cruiseEl = document.getElementById('cruiseBtn');
  var wallEl = document.getElementById('wallBtn');
  cruiseEl.classList.remove('on');
  wallEl.classList.remove('on');
  if (mode === 'cruise') {
    cruiseEl.classList.add('on');
    document.getElementById('modeLabel').textContent = 'Cruise';
  } else if (mode === 'maintain') {
    wallEl.classList.add('on');
    document.getElementById('modeLabel').textContent = 'Maintain';
  } else {
    document.getElementById('modeLabel').textContent = 'Manual';
  }
}

document.getElementById('cruiseBtn').onclick = function() { setDriveMode('cruise'); };
document.getElementById('wallBtn').onclick = function() { setDriveMode('maintain'); };

document.getElementById('stopBtn').onclick = function(){
  fetch('/api/mode', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{"mode":"stop"}'});
  document.getElementById('cruiseBtn').classList.remove('on');
  document.getElementById('wallBtn').classList.remove('on');
  document.getElementById('modeLabel').textContent = 'Manual';
  fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cmd:'stop',speed:0})});
};

document.getElementById('spBtn').onclick = function(){
  var sp = parseFloat(document.getElementById('spsp').value);
  var kp = parseFloat(document.getElementById('spkp').value);
  var ki = parseFloat(document.getElementById('spki').value);
  var kd = parseFloat(document.getElementById('spkd').value);
  if(isNaN(sp)||isNaN(kp)||isNaN(ki)||isNaN(kd)){document.getElementById('st').textContent='Invalid input';return}
  document.getElementById('st').textContent='Sending...';
  fetch('/api/pid', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({setpoint:sp,kp:kp,ki:ki,kd:kd})})
  .then(function(r){if(!r.ok){return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t)})}else{return r.json()}})
  .then(function(d){document.getElementById('st').textContent=d.status;})
  .catch(function(e){document.getElementById('st').textContent='PID err: '+e.message;console.error(e)})
};

var canvas = document.getElementById('graph');
var ctx = canvas.getContext('2d');
function resizeCanvas(){canvas.width=canvas.parentElement.clientWidth-4;canvas.height=180}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

function drawGraph(data){
  var w=canvas.width, h=canvas.height, pad=12;
  var gw=w-pad*2, gh=h-pad*2;
  ctx.clearRect(0,0,w,h);
  if(!data||!data.error||data.error.length<2)return;
  var maxV=1;
  data.error.forEach(function(v){var a=Math.abs(v);if(a>maxV)maxV=a;});
  data.output.forEach(function(v){var a=Math.abs(v);if(a>maxV)maxV=a;});
  data.setpoint.forEach(function(v){var a=Math.abs(v);if(a>maxV)maxV=a;});
  maxV=Math.ceil(maxV*1.2);if(maxV<5)maxV=5;
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=.5;
  for(var i=0;i<=4;i++){var y=pad+(gh/4)*i;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}
  var len=data.error.length;
  function plot(arr,col){
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();
    for(var i=0;i<len;i++){var x=pad+(i/(len-1))*gw;var y=pad+gh/2-(arr[i]/maxV)*(gh/2);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke()
  }
  plot(data.error,'#dc2626');plot(data.output,'#3b82f6');plot(data.setpoint,'#16a34a');
  ctx.fillStyle='#94a3b8';ctx.font='8px sans-serif';ctx.fillText('+'+maxV,pad,pad+8);ctx.fillText('0',pad,pad+gh/2+3);ctx.fillText('-'+maxV,pad,h-pad-2);
  ctx.fillStyle='#dc2626';ctx.fillText('Error',w-45,pad+8);ctx.fillStyle='#3b82f6';ctx.fillText('Output',w-45,pad+18);ctx.fillStyle='#16a34a';ctx.fillText('Set',w-45,pad+28)
}

function setCellColor(id,val,thresh){
  var el=document.getElementById(id+'Cell');
  if(val<0){el.className='sensor-cell safe';return}
  if(val<thresh/2){el.className='sensor-cell danger'}
  else if(val<thresh){el.className='sensor-cell warn'}
  else{el.className='sensor-cell safe'}
}

wsConnect();

var httpFallback = setInterval(function() {
  fetch('/api/status')
    .then(function(r) { return r.json(); })
    .then(function(d) { updateUI(d); })
    .catch(function() {});
}, 500);
</script>
</body>
</html>
